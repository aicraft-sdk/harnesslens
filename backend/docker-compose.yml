services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harnesslens
      POSTGRES_PASSWORD: harnesslens
      POSTGRES_DB: harnesslens
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U harnesslens']
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://harnesslens:harnesslens@db:5432/harnesslens
    command: ['npm', 'run', 'migration:run']

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DATABASE_URL: postgres://harnesslens:harnesslens@db:5432/harnesslens
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
    healthcheck:
      # The dev-stage image (node:22-alpine base) has no curl; use a Node-based probe instead so
      # `docker compose up -d --wait` reflects actual app-level readiness (GET /health -> 200),
      # not just "container started" -- NestJS's dev-mode watch runner doesn't process-exit on a
      # bootstrap failure (e.g. an unreachable DATABASE_URL) the way the production stage does, so
      # without this healthcheck a broken env var silently reports as healthy.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
