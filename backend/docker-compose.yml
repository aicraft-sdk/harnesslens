services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harnesslens
      POSTGRES_PASSWORD: harnesslens
      POSTGRES_DB: harnesslens
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U harnesslens']
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://harnesslens:harnesslens@db:5432/harnesslens
    command: ['npm', 'run', 'migration:run']

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DATABASE_URL: postgres://harnesslens:harnesslens@db:5432/harnesslens
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
